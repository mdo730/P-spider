[package]
name = "p-spider"
version = "1.3.1"
description = "A spider for P"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "protocol-asset", "shell-all", "fs-all", "path-all", "os-all", "clipboard-all", "app-all", "dialog-all", "window-all", "notification-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip"] }
winreg = "0.52"
# 缩略图在 Rust 端生成（解码/缩放/编码），避免占用 WebView 主线程导致白屏/OOM
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# 把切割图以「文件列表」写入剪贴板（粘贴得 N 张图）
clipboard-win = "5"
